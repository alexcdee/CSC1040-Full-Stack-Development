<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us</title>
</head>
<body>

    {% for num in numbers %}
        {% if num|divisibleby:2%}
            <p>{{num}} - Even</p>
        {% else %}
            <p>{{num}} - Odd</p>
        {% endif %}
    {% endfor %}

    
</body>
</html>
